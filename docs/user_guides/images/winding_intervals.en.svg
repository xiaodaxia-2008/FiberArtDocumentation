<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 1120 710" width="1120" height="710" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
  <title id="title">Pole-hole boundaries, return zones and tow centreline</title>
  <desc id="desc">The upper diagram shows axial pole offsets and return lengths. The lower detail shows the half-tow-width centreline adjustment along the meridian. Not to scale.</desc>
  <!-- Copyright © 2026 Zen Shawn. All rights reserved. Created 2026-10-22. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6f82"/>
    </marker>
  </defs>
  <rect width="1120" height="710" rx="12" fill="#fff"/>
  <g fill="#2c3e50">
    <text x="40" y="40" font-size="24" font-weight="700">Pole-hole boundaries, return zones and tow centreline</text>
    <!-- Axial positions; endpoint and pole labels are staggered. -->
    <g font-size="16">
      <text x="60" y="76">Left endpoint z_min</text>
      <text x="1060" y="76" text-anchor="end">Right endpoint z_max</text>
      <text x="300" y="104" text-anchor="middle" fill="#b8500f">Body region start</text>
      <text x="820" y="104" text-anchor="middle" fill="#b8500f">Body region end</text>
      <text x="130" y="168" text-anchor="middle" fill="#0b57d0">Left pole boundary</text>
      <text x="990" y="168" text-anchor="middle" fill="#0b57d0">Right pole boundary</text>
    </g>
    <line x1="60" y1="130" x2="1060" y2="130" stroke="#5f6f82" stroke-width="2" marker-end="url(#arrow)"/>
    <g stroke-width="2">
      <path d="M60 88 V238 M1060 88 V238" stroke="#5f6f82" stroke-dasharray="4 4"/>
      <path d="M130 118 V148 M130 176 V238 M990 118 V148 M990 176 V238" stroke="#0b57d0"/>
      <path d="M300 112 V238 M820 112 V238" stroke="#b8500f"/>
    </g>
    <rect x="60" y="192" width="70" height="38" fill="#edf0f4"/>
    <rect x="130" y="192" width="170" height="38" fill="#fce5ce"/>
    <rect x="300" y="192" width="520" height="38" fill="#dceafb"/>
    <rect x="820" y="192" width="170" height="38" fill="#fce5ce"/>
    <rect x="990" y="192" width="70" height="38" fill="#edf0f4"/>
    <g font-size="17" text-anchor="middle">
      <text x="215" y="217">Left return</text>
      <text x="560" y="217">Body region</text>
      <text x="905" y="217">Right return</text>
    </g>
    <g stroke="#5f6f82" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <line x1="63" y1="252" x2="127" y2="252"/>
      <line x1="133" y1="252" x2="297" y2="252"/>
      <line x1="823" y1="252" x2="987" y2="252"/>
      <line x1="993" y1="252" x2="1057" y2="252"/>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="95" y="280" fill="#0b57d0">dL</text>
      <text x="215" y="280" fill="#b8500f">rL</text>
      <text x="905" y="280" fill="#b8500f">rR</text>
      <text x="1025" y="280" fill="#0b57d0">dR</text>
    </g>
    <text x="60" y="319" font-size="17" fill="#0b57d0">dL / dR: Pole offsets (endpoint to pole boundary)</text>
    <text x="580" y="319" font-size="17" fill="#b8500f">rL / rR: Return lengths (pole boundary to body)</text>
    <text x="60" y="350" font-size="16" fill="#5f6f82">All distances above are axial; axial coordinates increase to the right.</text>
    <line x1="40" y1="375" x2="1080" y2="375" stroke="#d7dee8"/>
    <!-- The orange segment follows the curved meridian, not an axial line. -->
    <text x="40" y="413" font-size="20" font-weight="700">Left-end detail: inward adjustment along the meridian</text>
    <path d="M90 632 Q120 460 450 460" fill="none" stroke="#2c3e50" stroke-width="3"/>
    <path d="M123.75 556.75 Q150 524.5 195 503" fill="none" stroke="#b8500f" stroke-width="7"/>
    <circle cx="123.75" cy="556.75" r="6" fill="#0b57d0"/>
    <circle cx="195" cy="503" r="6" fill="#b8500f"/>
    <path d="M123.75 563 V621 H190" fill="none" stroke="#0b57d0" stroke-width="1.5"/>
    <text x="200" y="627" font-size="17" fill="#0b57d0">Pole boundary</text>
    <path d="M195 497 V452 H255" fill="none" stroke="#b8500f" stroke-width="1.5"/>
    <text x="265" y="447" font-size="16" fill="#b8500f">Adjusted centreline endpoint</text>
    <text x="300" y="493" font-size="16">Surface meridian</text>
    <g font-size="18">
      <text x="530" y="475" fill="#b8500f" font-weight="700">Target arc length = tow width / 2</text>
      <text x="530" y="520">The return zone limits the adjustment.</text>
      <text x="530" y="554" font-size="16">A return length of 0 keeps the centreline at the pole boundary.</text>
      <text x="530" y="598" font-size="16">Centreline adjustment also runs with a pole offset of 0.</text>
    </g>
    <text x="40" y="683" font-size="15" fill="#5f6f82">Not to scale. These are path calculation positions; the model geometry is unchanged.</text>
  </g>
</svg>
